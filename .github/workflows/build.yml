name: Build Cross-Platform QueueJoiner Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pystray Pillow

    - name: Install macOS specific packages
      if: runner.os == 'macOS'
      run: |
        pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit

    - name: Build Executable
      run: |
        python build.py

    - name: Package macOS Build
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cd dist
        zip -r QueueJoiner-macOS.zip QueueJoiner.app 2>/dev/null || zip -r QueueJoiner-macOS.zip QueueJoiner

    - name: Upload Windows Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: QueueJoiner-Windows
        path: dist/QueueJoiner.exe

    - name: Upload macOS Artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: QueueJoiner-macOS
        path: dist/QueueJoiner-macOS.zip
